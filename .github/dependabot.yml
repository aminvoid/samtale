version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Held back on purpose (ADR-0001). Remove an entry when its upgrade trigger in ADR-0001 is met:
    # ESLint 10 when eslint-plugin-react/jsx-a11y/import accept it; TypeScript 7 when typescript-eslint does.
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react*", "eslint-config-next", "next-intl"]
      lint-format:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "prettier*"]
      test:
        patterns:
          [
            "vitest",
            "@vitest/*",
            "@testing-library/*",
            "@playwright/test",
            "@axe-core/*",
            "jsdom",
            "fake-indexeddb",
            "fast-check",
          ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
